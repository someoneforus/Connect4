<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4 på rad</title>
    <link rel="stylesheet" href="style.css">
    <script src="./minimax.js" defer></script>
    <script src="./gameLogic.js" defer></script>
    <script src="./visual.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>

<body>
    <main class="main-content">
        <section class="hero">
            <h1 class="title">
                <div>C</div>
                <div class="tile yellow gameActive" id="heroTile"></div>
                <div>nnect4</div>
            </h1>
            <div class="container">
                <p>Chose a gamemode</p>
                <div class="gameBtns">
                    <button onclick="start(true)" class="btn level-btn"><i
                            class="fa-solid fa-user"></i><span>VS</span><i class="fa-solid fa-robot"></i></button>
                    <button onclick="start(false)" class="btn level-btn"><i
                            class="fa-solid fa-user"></i><span>VS</span><i class="fa-solid fa-user"></i></button>
                </div>
            </div>
        </section>

        <section class="game-container">
            <div id="grid-4">
            </div>
            <div class="info-container">
                <div class="playerIndicater">
                    <h2 class="pOne">P1</h2>
                    <h2 class="pTwo">P2</h2>
                    <div class="slider"></div>
                </div>
                <button onclick="restartGame()" id="restart" class="btn level-btn"><i
                        class="fa-solid fa-arrow-rotate-left"></i></button>
            </div>
        </section>

        <div id="message-container">
            <div class="messageDisplay">
                <h1 id="winDisplay"></h1>
                <button onclick="restartGame()" id="restart" class="btn level-btn"><i
                        class="fa-solid fa-arrow-rotate-left"></i></button>
                <button id="closeBtn" onclick="closeMsg()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </main>

</body>

</html>
